name: Windows control-plane

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp/**"
      - "scripts/**"
      - "benchmarks/**"
      - ".github/workflows/windows-control-plane.yml"
  workflow_dispatch:

jobs:
  verify:
    name: GPU-free contracts + frontend build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create backend test environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt

      - name: Run GPU-free control-plane checks
        shell: pwsh
        run: .\scripts\test-control-plane.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
